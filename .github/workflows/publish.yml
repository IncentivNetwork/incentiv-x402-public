name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag on main (vX.Y.Z or vX.Y.Z-pre.N)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the release tag
        id: release
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          n='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^v$n\.$n\.$n(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ && "${#TAG}" -le 128 ]]; then
            echo '::error::Use a vX.Y.Z or vX.Y.Z-pre.N release tag of at most 128 characters'
            exit 1
          fi
          if ! COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{commit}"); then
            echo "::error::Tag $TAG does not exist or does not point to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::Tag $TAG must point to a commit on main"
            exit 1
          fi
          VERSION=$(git show "$COMMIT:package.json" | jq -r .version)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION at $COMMIT"
            exit 1
          fi
          # A prerelease publishes under next; only a release moves latest.
          case "$VERSION" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          printf 'tag=%s\ncommit=%s\nversion=%s\ndist_tag=%s\n' "$TAG" "$COMMIT" "$VERSION" "$DIST_TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.release.outputs.commit }}

  publish:
    name: Publish
    needs: [release, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    concurrency:
      group: npm-publish
      queue: max
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; this job only
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DIST_TAG: ${{ needs.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.commit }}

      # Node 24 ships npm 11, which supports trusted publishing (11.5.1 or newer).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Check the package
        run: |
          set -euo pipefail
          PACKED=$(npm pack --dry-run --ignore-scripts --json)
          jq -e --arg v "$VERSION" '.[0].version == $v' <<< "$PACKED" >/dev/null
          jq -e '[.[0].files[].path] | index("dist/index.js") and all(startswith("dist/") or startswith("docs/") or . == "package.json" or . == "README.md" or . == "LICENSE")' <<< "$PACKED" >/dev/null
          jq -e '.scripts | has("preinstall") or has("install") or has("postinstall") | not' package.json >/dev/null
          if npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version $VERSION is already published"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"

      - run: echo "Published @incentiv/x402@$VERSION under $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
